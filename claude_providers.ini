# ~/.claude_providers.ini  ← If you want to add a provider, add a new section
# OpenAI Chat Completions (macOS/Linux): add API_FORMAT=openai and use a
# base URL including /v1. Credentials/models use the same keys shown below.
#
# Any other key in a section is written to settings.json as-is, e.g.
# CLAUDE_CODE_SUBAGENT_MODEL or ANTHROPIC_CUSTOM_HEADERS. Quotes around a
# value are optional and stripped, so KEY=value and KEY="value" are the same.

# Set CLAUDE_CODE_MAX_CONTEXT_TOKENS per provider to your model/server limit
# or a lower value. It controls Claude auto-compaction, not server capacity.

# Accounts — run multiple Claude Code logins side by side.
# A section with CLAUDE_CONFIG_DIR keeps its own login/settings in that folder.
# First run of 'claude work' will prompt you to log in with that account.
[work]
CLAUDE_CONFIG_DIR=~/.claude-work

[personal]
CLAUDE_CONFIG_DIR=~/.claude-personal

[deepseek]
ANTHROPIC_BASE_URL=https://api.deepseek.com/anthropic
ANTHROPIC_AUTH_TOKEN=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-flash
ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash
ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro
CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000


[go]
ANTHROPIC_BASE_URL=https://opencode.ai/zen/go
ANTHROPIC_API_KEY=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
ANTHROPIC_DEFAULT_SONNET_MODEL=deepseek-v4-flash
ANTHROPIC_DEFAULT_HAIKU_MODEL=deepseek-v4-flash
ANTHROPIC_DEFAULT_OPUS_MODEL=deepseek-v4-pro
CLAUDE_CODE_SUBAGENT_MODEL=deepseek-v4-flash
CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000
CLAUDE_CODE_DISABLE_ARTIFACT=1

[tokenrouter]
API_FORMAT=openai
ANTHROPIC_BASE_URL=https://api.tokenrouter.com/v1
ANTHROPIC_API_KEY=YOUR_TOKENROUTER_KEY
ANTHROPIC_DEFAULT_SONNET_MODEL=z-ai/glm-5.3-free
ANTHROPIC_DEFAULT_HAIKU_MODEL=z-ai/glm-5.3-free
ANTHROPIC_DEFAULT_OPUS_MODEL=z-ai/glm-5.3-free
CLAUDE_CODE_SUBAGENT_MODEL=z-ai/glm-5.3-free
CLAUDE_CODE_MAX_CONTEXT_TOKENS=1000000

[local]
API_FORMAT=openai
ANTHROPIC_BASE_URL=http://192.168.0.170:4009/v1
ANTHROPIC_API_KEY=local
ANTHROPIC_DEFAULT_SONNET_MODEL=openai/gpt-oss-20b
ANTHROPIC_DEFAULT_HAIKU_MODEL=openai/gpt-oss-20b
ANTHROPIC_DEFAULT_OPUS_MODEL=openai/gpt-oss-20b
CLAUDE_CODE_SUBAGENT_MODEL=openai/gpt-oss-20b
CLAUDE_CODE_MAX_CONTEXT_TOKENS=124000
